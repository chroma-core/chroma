# Public development credentials for Tilt only. Never use these in production.
apiVersion: v1
kind: Secret
metadata:
  name: chroma-auth-service
type: Opaque
stringData:
  data-plane-api-key: tilt-service-api-key
  config.toml: |
    tenant = "default_tenant"
    database = "default_database"
    api_keys = ["tilt-test-api-key"]
    data_plane_api_key = "tilt-service-api-key"
