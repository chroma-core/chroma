apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma-auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chroma-auth-service
  template:
    metadata:
      labels:
        app: chroma-auth-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: chroma-auth-service:latest
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8002
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/chroma-auth
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: chroma-auth-service
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: chroma-auth-service
spec:
  selector:
    app: chroma-auth-service
  ports:
    - name: http
      port: 8002
      targetPort: http
