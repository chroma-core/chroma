apiVersion: v1
kind: ConfigMap
metadata:
  name: work-queue-config
data:
  config.yaml: |
    work_queue:
      storage_path: "work-queue/queue.parquet"
      retry_backoff_initial_seconds: 10
      retry_backoff_max_seconds: 600
      persistence:
        time_threshold_seconds: 2
        pending_threshold: 100
