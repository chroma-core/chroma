[package]
name = "wal3"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
google-cloud-spanner = { workspace = true }
google-cloud-gax = { workspace = true }
opentelemetry = { workspace = true }
# WAL fragments use Snappy. Avoid Parquet 55's optional zstd 0.13 dependency
# in standalone WAL consumers without changing other workspace users' codecs.
parquet = { version = "55.1", default-features = false, features = ["async", "arrow", "snap", "brotli", "flate2", "lz4", "base64", "simdutf8"] }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
setsum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
uuid = { workspace = true }

chroma-storage = { workspace = true }
chroma-error = { workspace = true }
chroma-config = { workspace = true }
chroma-types = { workspace = true }

[dev-dependencies]
guacamole = { version = "0.11", default-features = false }
proptest = { workspace = true }
rand = { workspace = true }
