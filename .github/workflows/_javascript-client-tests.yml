name: JavaScript client tests

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # onnxruntime-node's postinstall downloads optional CUDA EP binaries, and
  # the 1.21.0 artifact now 404s. Tests only use the bundled CPU runtime.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: ./.github/actions/rust
        with:
          github-token: ${{ github.token }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@v3
        with:
          version: "9"
      - name: Install dependencies
        run: cd clients/new-js && pnpm install --no-frozen-lockfile
      - name: Test
        run: bin/ts-integration-test.sh
